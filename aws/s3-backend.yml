# An S3 bucket for one instance's storage backend (backend SPEC §7.4, §10.1), and a user that can write to it but
# not destroy what it wrote: the bucket is versioned, and the user can't delete versions, so whatever it deletes or
# overwrites stays recoverable for 180 days. That includes everything a stolen key could do.
#
#   aws cloudformation deploy --template-file aws/s3-backend.yml --stack-name music-blobs --capabilities CAPABILITY_IAM
#   aws cloudformation describe-stacks --stack-name music-blobs --query 'Stacks[0].Outputs'
#   aws iam create-access-key --user-name <User>
#
# The credential file (backend SPEC §10.1) then takes the outputs and the key, with `url_style = "virtual-host"`:
# `read_endpoint` is the ReadEndpoint output, which forwards to the bucket's virtual-host name.
AWSTemplateFormatVersion: 2010-09-09

Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # What the backend deletes or overwrites goes after 180 days, and the delete markers left alone once it has.
          - Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 180
            NoncurrentVersionExpiration:
              NoncurrentDays: 180
            ExpiredObjectDeleteMarker: true
          # Smaller objects would cost more in monitoring and transitions than they save.
          - Status: Enabled
            ObjectSizeGreaterThan: 1048576
            # Only the tiers that serve a read at once: no IntelligentTieringConfiguration opts into the archive ones,
            # which the backend couldn't read.
            Transitions:
              - StorageClass: INTELLIGENT_TIERING
                TransitionInDays: 0
            # Read only to recover from a mistake, after a restore. Deep Archive's 180 days minimum is the retention.
            NoncurrentVersionTransitions:
              - StorageClass: DEEP_ARCHIVE
                TransitionInDays: 0

  # What the backend does (`backend/src/objects.rs`): list, read, write and delete objects. Not s3:DeleteObjectVersion,
  # so a delete only adds a delete marker.
  User:
    Type: AWS::IAM::User
    Properties:
      Policies:
        - PolicyName: e2ee-store-backend
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Also what makes a missing object 404 rather than 403, which the backend tells apart.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt Bucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub "${Bucket.Arn}/*"

  # The same reads, through CloudFront: S3 doesn't charge for what it sends there, and CloudFront's free tier is larger
  # than S3's. Only reads: CloudFront charges for what it sends on to S3, so writes go to S3 directly.
  #
  # The backend's requests carry their signature in the query string, made for the bucket's own host (the origin's
  # domain). CloudFront passes the query string on and sends the origin's host, not its own, so S3 checks the signature
  # as it would a direct request, and refuses what isn't signed: the bucket stays private, with no origin access
  # control, which would sign the request a second time. Nothing is cached: the signature changes with every request,
  # and an object served from the cache would skip S3's check.
  Reads:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "${AWS::StackName}: reads of ${Bucket}"
        # North America and Europe: the cheapest edges, and enough for one host's backend.
        PriceClass: PriceClass_100
        # Over HTTP/2 or 3, a read cancelled midway ends its stream, not the connection, so the next read doesn't pay
        # for a new one.
        HttpVersion: http2and3
        Origins:
          - Id: bucket
            DomainName: !GetAtt Bucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: bucket
          ViewerProtocolPolicy: https-only
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: false
          # Managed-CachingDisabled.
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          # Managed-AllViewerExceptHostHeader: every query string (the signature) and header (`Range`), but not `Host`.
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
        # Errors aren't kept either: by default CloudFront answers with an error again for 10 s, whatever S3 has by
        # then, and a 404 is what tells the backend a copy is gone.
        CustomErrorResponses:
          - { ErrorCode: 403, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 404, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 416, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 500, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 502, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 503, ErrorCachingMinTTL: 0 }
          - { ErrorCode: 504, ErrorCachingMinTTL: 0 }

Outputs:
  Bucket:
    Value: !Ref Bucket
  Region:
    Value: !Ref AWS::Region
  Endpoint:
    Value: !Sub "https://s3.${AWS::Region}.amazonaws.com"
  # Reads there are signed for the virtual-host endpoint, `https://<Bucket>.s3.<Region>.amazonaws.com`.
  ReadEndpoint:
    Value: !Sub "https://${Reads.DomainName}"
  User:
    Value: !Ref User
