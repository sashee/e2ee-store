[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Generic backend: passkey users and git-like per-user storage (blobs + refs)"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
http-body-util = "0.1"
humantime = "2"
md-5 = "0.11.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
rusqlite = { version = "0.40", features = ["bundled", "blob"] }
rustix = { version = "1", features = ["fs"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rusty-s3 = "0.10.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "macros", "time", "fs"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5.8"
webauthn_rp = { version = "0.3.0", features = ["serde_relaxed", "serializable_server_state"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
# Tests lower SQLite's length limit to catch queries that load a blob whole.
rusqlite = { version = "0.40", features = ["limits"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
