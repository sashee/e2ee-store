[package]
name = "backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Generic backend: passkey users and git-like per-user storage (blobs + refs)"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.3"
http-body-util = "0.1"
humantime = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "sync", "macros", "time", "fs"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
webauthn_rp = { version = "0.3.0", features = ["serde_relaxed", "serializable_server_state"] }

[dev-dependencies]
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
